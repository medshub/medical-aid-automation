name: Deploy Vercel

# Automated production deploy on every push to main + manual run.
# One-time setup: GitHub secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# See docs/AUTOMATE_DEPLOY.md

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Require secrets
        run: |
          missing=
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "### Deploy not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Follow **docs/AUTOMATE_DEPLOY.md** (5 minutes)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing$missing — add GitHub Actions secrets to automate deploys."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Verify production
        env:
          BASE: ${{ secrets.VERCEL_APP_URL }}
        run: |
          set -e
          base="${BASE:-https://medical-aid-automation.vercel.app}"
          echo "Checking $base ..."
          sleep 15

          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$base/api/health")
          echo "health → $code"
          cat /tmp/health.json
          test "$code" = "200"
          python3 -c "import json; assert json.load(open('/tmp/health.json')).get('ok') is True"

          home=$(curl -sS "$base/")
          if ! echo "$home" | grep -q '2027'; then
            echo "::warning::Home HTML missing 2027 — CDN may lag 1–2 min"
          else
            echo "Home has 2027 banner marker"
          fi

          demo=$(curl -sS -o /dev/null -w "%{http_code}" "$base/org/demo")
          echo "/org/demo → $demo"
          if [ "$demo" != "200" ]; then
            echo "::warning::/org/demo is $demo (expect 200 after full rollout)"
          fi

          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "**Preview/Prod URL:** ${{ steps.vercel.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Health:** $code" >> "$GITHUB_STEP_SUMMARY"
          echo "**/org/demo:** $demo" >> "$GITHUB_STEP_SUMMARY"
